name: RETROTV Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrotv-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK for testing
        run: gradle assembleDebug

      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: RETROTV-debug-test-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Validate release signing credentials
        id: signing
        env:
          RETROTV_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY || secrets.RETROTV_KEYSTORE_BASE64 }}
          RETROTV_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RETROTV_KEYSTORE_PASSWORD }}
          RETROTV_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RETROTV_KEY_ALIAS }}
          RETROTV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RETROTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RETROTV_KEYSTORE_BASE64" ] || [ -z "$RETROTV_KEYSTORE_PASSWORD" ] || [ -z "$RETROTV_KEY_ALIAS" ] || [ -z "$RETROTV_KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Check SIGNING_KEY, ALIAS, KEY_STORE_PASSWORD, and KEY_PASSWORD."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/retrotv-signing"
          KEYSTORE="$RUNNER_TEMP/retrotv-signing/release.jks"
          printf '%s' "$RETROTV_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::SIGNING_KEY decoded to an empty file."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$RETROTV_KEYSTORE_PASSWORD" -alias "$RETROTV_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore check failed. The keystore file, KEY_STORE_PASSWORD, or ALIAS is incorrect."
            exit 1
          fi

          TESTSTORE="$RUNNER_TEMP/retrotv-signing/validate.p12"
          if ! keytool -importkeystore -noprompt             -srckeystore "$KEYSTORE"             -srcstoretype JKS             -srcstorepass "$RETROTV_KEYSTORE_PASSWORD"             -srcalias "$RETROTV_KEY_ALIAS"             -srckeypass "$RETROTV_KEY_PASSWORD"             -destkeystore "$TESTSTORE"             -deststoretype PKCS12             -deststorepass 'TemporaryValidationOnly-4827'             >/dev/null 2>&1; then
            echo "::error::Private-key check failed. KEY_PASSWORD or ALIAS does not unlock a private key in this keystore."
            exit 1
          fi
          rm -f "$TESTSTORE"

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Signing keystore, store password, alias, and private-key password validated."

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          RETROTV_KEYSTORE_PATH: ${{ runner.temp }}/retrotv-signing/release.jks
          RETROTV_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RETROTV_KEYSTORE_PASSWORD }}
          RETROTV_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RETROTV_KEY_ALIAS }}
          RETROTV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RETROTV_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Prepare release APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Retro-TV-2.1.${GITHUB_RUN_NUMBER}.apk"

      - name: Publish GitHub Release
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Retro TV 2.1.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: release/Retro-TV-2.1.${{ github.run_number }}.apk
